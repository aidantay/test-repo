name: "Run Test Suite"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage:
          - 01-windows

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: "Run stage tests"
        run: |
          make test-venv stage=${{ matrix.stage }}
