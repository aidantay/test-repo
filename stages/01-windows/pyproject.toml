[project]
name = "windows"
version = "0.0.0"
description = "Stage 1 - Peptide Window Extraction"
authors = [
    { name = "aidantay", email = "apsltay@outlook.com" },
]
requires-python = ">=3.12, <3.14"
dependencies = [
    "shared-libs", # Add it to dependencies so uv installs it alongside windows
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.0",
    "pytest-randomly>=4.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.0.0",
    "ruff>=0.15.0",
    "mypy>=2.0.0",
]
build = [
    "pyinstaller>=6.11.0",
]

[project.scripts]
01-windows = "windows.main:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
shared-libs = { path = "../../commons/shared_libs", editable = true } # Tells uv to link shared-libs

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "D",    # pydocstyle
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ANN",  # flake8-annotations
    "UP",   # pyupgrade
    "ARG",  # Clean signatures
    "SIM",  # Simplified logic
    "TCH",  # Optimized type imports
    "PTH",  # Modern path handling (i.e., use pathlib instead of os.path)
    "RUF",  # Ruff-specific power rules
    "N",    # pep8-naming
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "S101",   # Allow 'assert' in tests
    "ARG",    # Unused argument (common for pytest fixtures)
    "D",      # Missing docstrings
    "ANN",    # Missing type hints
    "E501",   # Long lines
]
"**/__init__.py" = [
    "F401",   # Allow unused imports in __init__.py (common for API exports)
    "D",      # Allow missing docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"   # Options: "google", "numpy", "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov-report=term-missing",
    "--cov-branch",
    "--timeout=30",
    "--import-mode=importlib",
]

[tool.mypy]
python_version = "3.13"
strict = true
